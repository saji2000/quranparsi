server {
    listen 80;
    server_name quranparsi.com www.quranparsi.com;

    root /home/sajad/submission/quranparsi/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
